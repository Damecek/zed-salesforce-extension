name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust and Visualforce gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python compatibility dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Verify Python baseline and JSON-RPC framing
        run: |
          python3 scripts/test-python-baseline.py
          python3 scripts/test-visualforce-lsp-framing.py
      - name: Verify Visualforce integration and artifact identity
        run: python3 scripts/test-visualforce-integration.py
      - name: Install Rust wasm target
        run: rustup target add wasm32-wasip2
      - name: Verify Rust formatting, builds, and tests
        run: |
          cargo fmt -- --check
          cargo check
          cargo check --target wasm32-wasip2
          cargo test
