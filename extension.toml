id = "salesforce"
name = "Salesforce"
version = "0.0.4"
schema_version = 1
authors = ["zed-salesforce-extension contributors"]
description = "Salesforce DX language support for Zed (Apex LSP via aer; jorje opt-in)."
repository = "https://github.com/Damecek/zed-salesforce-extension"

snippets = [
    "snippets/apex.json",
    "snippets/soql.json",
    "snippets/sosl.json",
]

[language_servers.apex-language-server]
name = "Apex Language Server"
# SOQL is wired to apex-language-server because aer (the default backend) ships SOQL
# diagnostics, hover, and field validation against the local schema
# (see aer release notes v0.0.101 / v0.0.113). The jorje backend ignores
# SOQL buffers — that is intentional; users on jorje see only highlights.
languages = ["Apex", "SOQL"]

[language_servers.apex-language-server.language_ids]
"Apex" = "apex"
"SOQL" = "soql"

[language_servers.lwc-language-server]
name = "LWC Language Server"
# Zed currently registers language servers by language name, not by path glob.
# This attaches the LWC server to HTML/JavaScript buffers globally; Salesforce
# workspace scoping is handled by the server itself where possible.
languages = ["HTML", "JavaScript"]

[language_servers.lwc-language-server.language_ids]
"HTML" = "html"
"JavaScript" = "javascript"

[grammars.apex]
repository = "https://github.com/aheber/tree-sitter-sfapex"
rev = "60cc57049ed6dd4e28e528024a0230ee8fb8a64d"
# tree-sitter-sfapex is a multi-grammar repo; Apex grammar lives in the `apex/` subdir.
path = "apex"

[grammars.soql]
repository = "https://github.com/aheber/tree-sitter-sfapex"
rev = "60cc57049ed6dd4e28e528024a0230ee8fb8a64d"
path = "soql"

[grammars.sosl]
repository = "https://github.com/aheber/tree-sitter-sfapex"
rev = "60cc57049ed6dd4e28e528024a0230ee8fb8a64d"
path = "sosl"

[grammars.sflog]
repository = "https://github.com/aheber/tree-sitter-sfapex"
rev = "60cc57049ed6dd4e28e528024a0230ee8fb8a64d"
path = "sflog"
