id = "salesforce"
name = "Salesforce DX"
version = "0.0.2"
schema_version = 1
authors = ["zed-salesforce-extension contributors"]
description = "Salesforce DX language support for Zed (MVP bootstrap; Apex LSP backend)."
repository = "https://github.com/Damecek/zed-salesforce-extension"

[language_servers.apex-lsp]
name = "Apex Language Server"
languages = ["Apex"]

[language_servers.apex-lsp.language_ids]
"Apex" = "apex"

[grammars.apex]
repository = "https://github.com/aheber/tree-sitter-sfapex"
rev = "3597575a429766dd7ecce9f5bb97f6fec4419d5d"
# tree-sitter-sfapex is a multi-grammar repo; Apex grammar lives in the `apex/` subdir.
path = "apex"

[grammars.soql]
repository = "https://github.com/aheber/tree-sitter-sfapex"
rev = "3597575a429766dd7ecce9f5bb97f6fec4419d5d"
path = "soql"

[grammars.sosl]
repository = "https://github.com/aheber/tree-sitter-sfapex"
rev = "3597575a429766dd7ecce9f5bb97f6fec4419d5d"
path = "sosl"

[grammars.sflog]
repository = "https://github.com/aheber/tree-sitter-sfapex"
rev = "3597575a429766dd7ecce9f5bb97f6fec4419d5d"
path = "sflog"
